name: Android app

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # Set this repository variable (Settings > Secrets and variables > Actions > Variables)
      # to the site's https address so the APK opens your deployment.
      SUNNY_SERVER_URL: ${{ vars.SUNNY_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: sunny-side-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
