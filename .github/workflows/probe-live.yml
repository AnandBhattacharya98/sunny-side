name: Probe live site (temporary diagnostics)
on:
  push:
    branches: [claude/project-thread-3j1x9q]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3 4 5 6; do
            date -u
            curl -sS -m 60 -o /tmp/b -w "healthz %{http_code} %{time_total}s\n" https://pm-job-hunter-qfva.onrender.com/healthz; head -c 300 /tmp/b; echo
            curl -sS -m 60 -o /tmp/h -w "home %{http_code} %{time_total}s\n" https://pm-job-hunter-qfva.onrender.com/; head -c 200 /tmp/h; echo
            sleep 20
          done
